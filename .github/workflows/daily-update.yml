# Keeps the website's league database current: tip times, lineup locks, box scores,
# season to date stats and the injury report. See sync/sync.py for what it writes.
name: League update

on:
  schedule:
    - cron: '17 * * * *'   # every hour at :17 (UTC); box scores land within an hour or two of each game
  workflow_dispatch: {}    # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths: ['feed/**', 'sync/**']

concurrency:
  group: league-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sync/requirements.txt
      - name: Install
        run: |
          pip install -r sync/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Update the league database
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python sync/sync.py

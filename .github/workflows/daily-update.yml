# Keeps the website's league database current: tip times, lineup locks, box scores,
# season to date stats and the injury report. See sync/sync.py for what it writes.
name: League update

on:
  schedule:
    - cron: '17 * * * *'   # every hour at :17 (UTC); box scores land within an hour or two of each game
  workflow_dispatch: {}    # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths: ['feed/**', 'sync/**']

concurrency:
  group: league-update
  cancel-in-progress: false

permissions:
  contents: write   # to save the rebuilt game log (gamelog.json)
  pages: write      # to republish the website after saving it

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sync/requirements.txt
      - name: Install
        run: |
          pip install -r sync/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Update the league database
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python sync/sync.py
      - name: Save the game log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- gamelog.json; then echo "Game log unchanged"; exit 0; fi
          git config user.name "league-update"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gamelog.json
          git commit -q -m "Game log update"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent || echo "Pages rebuild request skipped"

<!doctype html>
<html lang="en">
<head>

<body>
<title>B1G Hoops Fantasy League</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: arena-band header + scorebook pages. Stats set in mono like a box score; condensed caps for signage. */
:root{
  --paper:#F2F4F6; --card:#FFFFFF; --ink:#111B27; --ink2:#4B5968; --ink3:#7A8794; --line:#D8DEE5; --line2:#E8ECF0;
  --band:#0F2A47; --band-ink:#F2F5F8; --band-ink2:#A9BBD0;
  --accent:#C4531A; --accent-soft:#F8E7DC; --accent-ink:#FFFFFF;
  --win:#1E7A4C; --win-soft:#DFF1E7; --loss:#B0322A; --loss-soft:#F7E1DF; --warn:#9A6400; --warn-soft:#FBEFD6;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0C121A; --card:#141C26; --ink:#E6EBF0; --ink2:#A3B0BD; --ink3:#73818F; --line:#283444; --line2:#1D2733;
  --band:#0A1C31; --band-ink:#EEF3F8; --band-ink2:#8FA6BF;
  --accent:#F0803D; --accent-soft:#3A2416; --accent-ink:#1A0E06;
  --win:#5CCB92; --win-soft:#15301F; --loss:#F08A80; --loss-soft:#3A1A17; --warn:#E8B45A; --warn-soft:#33270F; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0C121A; --card:#141C26; --ink:#E6EBF0; --ink2:#A3B0BD; --ink3:#73818F; --line:#283444; --line2:#1D2733;
  --band:#0A1C31; --band-ink:#EEF3F8; --band-ink2:#8FA6BF;
  --accent:#F0803D; --accent-soft:#3A2416; --accent-ink:#1A0E06;
  --win:#5CCB92; --win-soft:#15301F; --loss:#F08A80; --loss-soft:#3A1A17; --warn:#E8B45A; --warn-soft:#33270F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.band{background:var(--band);color:var(--band-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-bottom:3px solid var(--accent)}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-block:12px 4px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1.1}
.brand .season{font-family:var(--f-mono);font-size:12px;color:var(--band-ink2)}
.brand .who{margin-left:auto;font-size:12px;color:var(--band-ink2)}
nav.main{display:flex;flex-wrap:wrap;gap:4px 18px;padding-block:6px 10px}
nav.main::-webkit-scrollbar{display:none}
.navgrp{display:flex;align-items:center;gap:2px;flex:none}
.navgrp .lbl{font-family:var(--f-display);font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--band-ink2);margin-right:6px}
nav.main a{color:var(--band-ink);text-decoration:none;font-size:13.5px;padding:4px 8px;border-radius:4px;white-space:nowrap}
nav.main a:hover{background:rgba(255,255,255,.08)}
nav.main a[aria-current="page"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
nav.main a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:24px 64px}
h2.vt{font-family:var(--f-display);font-weight:700;font-size:34px;text-transform:uppercase;letter-spacing:.01em;margin:0 0 4px;line-height:1.05;text-wrap:balance}
.vsub{color:var(--ink2);margin:0 0 20px;max-width:70ch}
h3{font-family:var(--f-display);font-weight:600;font-size:21px;text-transform:uppercase;letter-spacing:.03em;margin:0 0 10px;text-wrap:balance}
h4{font-size:14px;margin:0 0 6px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--ink2)} .small{font-size:13px} .tiny{font-size:12px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-display);font-size:13px;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);font-weight:600}
.tw{overflow:auto;max-height:min(75vh,900px);border:1px solid var(--line);border-radius:6px;background:var(--card);overscroll-behavior-x:contain;scrollbar-width:auto;scrollbar-color:var(--ink2) transparent}
.tw::-webkit-scrollbar{width:10px;height:10px}.tw::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:2px solid var(--card)}.tw::-webkit-scrollbar-thumb:hover{background:var(--ink2)}
.tw thead th{z-index:2}.tw.stick2 td:nth-child(2),.tw.stick2 th:nth-child(2){position:sticky;left:0;background:var(--card);z-index:1;box-shadow:1px 0 0 var(--line)}.tw.stick2 thead th:nth-child(2){z-index:3}
.inj{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;border-radius:4px;font:700 11px/1 var(--f-mono);vertical-align:1px;cursor:help;text-decoration:none}.inj-Q{background:#f9eeda;color:#8a5a00;border:1px solid #e8c37a}.inj-D{background:#f9ece7;color:#a4401b;border:1px solid #eba585}.inj-O{background:#c8321e;color:#fff;border:1px solid #c8321e}
.scrollhint{font-size:12px;color:var(--ink2);margin:4px 0 6px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line2);white-space:nowrap}
th.sortable{cursor:pointer;user-select:none}th.sortable:hover{color:var(--ink)}th.sortable .sarr{display:inline-block;margin-left:4px;font-size:10px;opacity:.35}th.sorted{color:var(--ink)}th.sorted .sarr{opacity:1;color:var(--accent)}
th{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:var(--ink2);background:var(--card);position:sticky;top:0}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px;font-weight:500}
.sw{width:10px;height:10px;border-radius:2px;flex:none;box-shadow:0 0 0 1px var(--line)}
.pill{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.pill.acc{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.pill.ok{background:var(--win-soft);border-color:transparent;color:var(--win)}
.pill.bad{background:var(--loss-soft);border-color:transparent;color:var(--loss)}
.pill.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
button,.btn{font:inherit;font-size:13.5px;font-weight:500;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:5px;cursor:pointer}
button:hover{border-color:var(--ink3)}
button.pri,.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
a.btn{display:inline-block;text-decoration:none;color:var(--ink)}
a.btn.pri{color:var(--accent-ink)}
button.ghost{border-color:transparent;background:transparent;color:var(--accent);padding:4px 6px}
button.danger{color:var(--loss)}
button:disabled{opacity:.5;cursor:not-allowed}
input,select{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:6px 8px;min-width:0}
input.st{width:46px;padding:3px 4px;text-align:right;font-family:var(--f-mono);font-size:13px;background:var(--paper)}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink2)}
.notice{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 5px 5px 0;font-size:14px}
.notice.warn{border-color:var(--warn);background:var(--warn-soft)}
.empty{border:1px dashed var(--line);border-radius:6px;padding:28px 18px;text-align:center;color:var(--ink2);background:var(--card)}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);text-transform:uppercase;letter-spacing:.04em;font-size:18px;margin-bottom:4px}
/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:stretch;margin-bottom:28px}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.hero .big{font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:clamp(36px,6vw,60px);line-height:.95;margin:6px 0 10px;text-wrap:balance}
.clock{background:var(--band);color:var(--band-ink);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:6px;justify-content:center}
.clock .lbl{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.14em;font-size:13px;color:var(--band-ink2)}
.clock .val{font-family:var(--f-mono);font-size:44px;line-height:1;color:#FFB27F}
.clock .val small{font-size:15px;color:var(--band-ink2);margin-left:6px}
.rules{columns:2 380px;column-gap:28px}
.rules section{break-inside:avoid;margin-bottom:22px}
.rules ol,.rules ul{padding-left:20px;margin:0}
.rules li{margin-bottom:6px;max-width:68ch}
.scorekey{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:14px}
.scorekey .num{text-align:right;color:var(--accent);font-weight:500}
.pcard{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:6px;min-height:52px}
.pcard .slot{font-family:var(--f-mono);font-size:11px;color:var(--ink3);width:64px;flex:none}
.pcard .nm{flex:1;min-width:0}
.pcard[draggable=true]{cursor:grab}
.pcard[draggable=true]:hover{border-color:var(--ink3)}
.pcard.static{background:var(--paper)}
.pcard.picked{outline:2px solid var(--accent);outline-offset:-1px;background:var(--accent-soft)}
.ordlist{list-style:none;padding:0;margin:0 0 10px}.ordrow{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;border:1px solid transparent}.ordrow+.ordrow{margin-top:4px}.ordrow[draggable=true]{cursor:grab}.ordrow.sel{background:var(--accent-soft);border-color:var(--accent)}.ordrow.over{outline:2px dashed var(--accent);outline-offset:-1px}.ordrow.dragging{opacity:.45}.opick{width:32px;height:32px;border-radius:6px;font-weight:700;padding:0;flex:none}.ordrow.sel .opick{background:var(--accent);color:var(--accent-ink)}.onm{flex:1}.ogrip{opacity:.4;font-size:16px}
.pcard.over{outline:2px dashed var(--accent);outline-offset:-1px}
.pcard.dragging{opacity:.45}
.pcard .grip{color:var(--ink3);font-size:16px;flex:none}
/* roster summary: tabbed team view in the hub palette */
.slp{--s-bg:transparent;--s-in:var(--card);--s-card:var(--paper);--s-ink:var(--ink);--s-ink2:var(--ink2);--s-line:var(--line2);--s-teal:var(--accent);--s-teal-ink:var(--accent-ink);--s-tealbg:var(--accent-soft);--s-red:var(--loss);
  background:transparent;color:var(--s-ink);font-family:var(--f-body)}
.slp button{font-family:inherit}
.sbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:4px 6px 14px}
.slg{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#7a3a12);display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff}
.sbt{font-weight:700;font-size:20px}.sbs{color:var(--s-ink2);font-weight:600;font-size:15px}
.sin{background:var(--s-in);border:1px solid var(--s-line);border-radius:16px;padding:16px}
.stabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.stab{flex:none;border:0;border-radius:10px;background:var(--tab);color:var(--s-teal);font-weight:600;font-size:13px;letter-spacing:.04em;text-transform:uppercase;padding:10px 16px;cursor:pointer}
.stab.on{background:var(--s-teal);color:var(--s-teal-ink)}
.stab:focus-visible,.slp button:focus-visible,.slp select:focus-visible,.slp input:focus-visible{outline:2px solid var(--s-teal);outline-offset:2px}
.shead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 16px}
.sava{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;font-size:15px}
.sava.sm{width:34px;height:34px;font-size:12px}
.shn{display:flex;flex-direction:column;min-width:0;flex:1}.sht{font-weight:700;font-size:17px}
.s2{color:var(--s-ink2);font-size:12px}
.ssel{background:var(--s-card);color:var(--s-ink);border:1px solid var(--s-line);border-radius:10px;padding:7px 10px;font-size:13px;max-width:100%}
.sicon{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--s-ink);font-size:10px;font-weight:600;text-transform:uppercase;cursor:pointer}
.sicon span:first-child{width:38px;height:38px;border-radius:50%;background:var(--s-card);border:1px solid var(--s-line);display:grid;place-items:center;font-size:16px}
.srow0{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.ssec{font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.03em}
.srd{display:flex;align-items:center;gap:6px;background:var(--s-card);border-radius:10px;padding:4px 6px;font-weight:700;font-size:14px}
.srd button{background:none;border:0;color:var(--s-ink);font-size:20px;line-height:1;padding:2px 6px;cursor:pointer}.srd button:disabled{opacity:.3}
.scols,.srow{display:grid;grid-template-columns:44px 36px minmax(0,1fr) 62px 52px auto;gap:10px;align-items:center}
.scols{color:var(--s-ink2);font-size:11px;font-weight:600;text-transform:uppercase;padding:6px 8px}.scols span:nth-child(4),.scols span:nth-child(5){text-align:right}
.srng{display:block;font-size:10px;font-weight:400;opacity:.6;white-space:nowrap;margin-top:1px}
.gl-h{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.gl-h .big{font-size:28px;font-weight:700}
.srow{padding:9px 8px;border-top:1px solid var(--s-line);min-height:58px}
.srow.sel{background:var(--accent-soft);border-radius:10px}.srow[draggable=true]{cursor:grab}.srow.over{outline:2px dashed var(--s-teal);border-radius:10px}.srow.dragging{opacity:.4}
.spos{width:40px;height:30px;border-radius:15px;border:0;font-weight:700;font-size:12px;display:grid;place-items:center;color:#10151f}
button.spos{cursor:pointer}
.spos.pg{background:#58d1c0}.spos.pf{background:#f4a35d}.spos.pc{background:#a98bf2}.spos.pb{background:#55627a;color:#e8edf5}.spos.pu{background:#3a465d;color:#cfd7e6;font-size:10px}
.spos.sel{box-shadow:0 0 0 3px var(--s-teal)}.spos.tgt{background:var(--s-teal);color:var(--s-teal-ink);animation:spulse 1.2s ease-in-out infinite}
@keyframes spulse{50%{box-shadow:0 0 0 4px rgba(51,214,184,.25)}}
.sav{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.sav.sq{border-radius:9px;font-size:10px}.sav.empty{background:var(--s-card)}
.snm{display:flex;flex-direction:column;min-width:0}.sn{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sdot{opacity:.6}
.snum{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--s-ink2)}.snum.strong{color:var(--s-ink);font-weight:600}
.sact{width:30px;height:30px;border-radius:50%;border:0;font-size:18px;font-weight:700;cursor:pointer;display:grid;place-items:center}
.sact.add{background:var(--s-teal);color:var(--s-teal-ink)}.sact.drop{background:var(--s-red);color:#2a0b10}
.stot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--s-line);padding:10px 8px 0;font-size:13px;color:var(--s-ink2)}.stot strong{color:var(--s-ink)}
.sban{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--s-teal);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.steal{background:var(--s-teal);color:var(--s-teal-ink);border:0;border-radius:9px;padding:7px 14px;font-weight:700;cursor:pointer}
.sghost{background:none;border:1px solid var(--s-line);color:var(--s-ink);border-radius:9px;padding:7px 12px;cursor:pointer}
.schip{background:var(--s-card);color:var(--s-ink2);border:1px solid var(--s-line);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer}.schip.on{background:var(--s-teal);color:var(--s-teal-ink);border-color:var(--s-teal)}
.ssearch{flex:1 1 140px;background:var(--s-card);color:var(--s-ink);border:1px solid var(--s-line);border-radius:20px;padding:6px 12px}
.sempty{padding:24px;text-align:center;color:var(--s-ink2)}
.sleague{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-top:1px solid var(--s-line);color:var(--s-ink);padding:10px 8px;text-align:left;cursor:pointer}.sleague.on{background:var(--accent-soft);border-radius:10px}
.srk{width:20px;color:var(--s-ink2);font-weight:700}
.smug{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:8px 0 12px}
.smu{display:flex;align-items:center;gap:10px;background:var(--s-card);border-radius:12px;padding:12px;min-width:0}.smu.won{box-shadow:inset 0 0 0 2px var(--s-teal)}
.smus{text-align:right}.snumbig{font-family:var(--f-mono);font-size:22px;font-weight:600}.svs{color:var(--s-ink2);font-weight:700;text-transform:uppercase;font-size:12px}
.smug2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.smi{display:flex;justify-content:space-between;gap:8px;padding:7px 4px;border-top:1px solid var(--s-line);font-size:13px}
@media (max-width:620px){.slp{padding:8px;border-radius:14px}.sin{padding:10px}.shead .ssel{order:3;flex:1 1 100%}.sbs{flex-basis:100%}.scols,.srow{grid-template-columns:36px 30px minmax(0,1fr) 40px 38px auto;gap:6px}.spos{width:34px}.sav{width:30px;height:30px;font-size:11px}.sn{font-size:13px}.smug{grid-template-columns:1fr}.svs{text-align:center}.smug2{grid-template-columns:1fr}.sbt{font-size:17px}}
@media (prefers-reduced-motion:reduce){.spos.tgt{animation:none}}
.spos.sm{width:32px;height:24px;font-size:11px;display:inline-grid}
.sin{border-radius:6px}
.stab{border-radius:4px;background:transparent;border:1px solid var(--line);color:var(--ink);font-family:var(--f-display);font-size:15px;letter-spacing:.06em;padding:6px 14px}
.stab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sbt,.sht,.ssec{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.03em}.sht{font-size:20px}.ssec{font-size:17px}
.sava,.sav{border-radius:6px}.sav.sq{border-radius:4px}

function tipAt(g){const t=tipOf(g);const m=t.match(/^(\d{1,2})(?::(\d{2}))?\s*([AP])M$/i);const d=g.date;
  if(!m)return {ts:Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),12+5,0),known:false}; // unknown: treat as noon ET
  let h=+m[1]%12+(m[3].toUpperCase()==='P'?12:0);return {ts:Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),h+5,+(m[2]||0)),known:true}}
function firstGame(R){const gs=[...new Map(R.entries.map(e=>[e.game.id,e.game])).values()];let best=null;for(const g of gs){const t=tipAt(g);if(!best||t.ts<best.t.ts)best={g,t}}return best}
const lockTs=R=>firstGame(R).t.ts;
function fmtLock(R){const f=firstGame(R);return `${fmtDW(f.g.date)}, ${f.t.known?tipOf(f.g)+' ET':'time TBA'}`}
function roundStatus(){
  const t=Date.now();
  const live=ROUNDS.filter(r=>lockTs(r)<=t&&r.end.getTime()+864e5>t);
  const next=ROUNDS.find(r=>lockTs(r)>t)||null;
  return {live,next};
}

/* ===================== Season plan & scoring ===================== */
const PO_START=[15,17],PO_END=[16,20];
function bracketFor(q){const pr=Math.max(1,Math.ceil(Math.log2(q)));if(q===10)return {q,pr,byes:2,dbl:true};return {q,pr,byes:2**pr-q}}
/* 10 team field: seeds 1 and 2 skip Round 1 and the quarterfinals; seeds 3 to 10 play down to 2 semifinalists */
const SLOTS10=[1,0,0,0,3,10,6,7,2,0,0,0,4,9,5,8];
const playoffTeams=()=>{const n=leagueSize(),q=+(S.cfg.playoffTeams||0);return q>=2&&q<=n&&q%2===0?q:0};
function poRounds(n){return bracketFor(playoffTeams()||Math.min(n,4))}
function byeTxt(b,dbl){if(dbl)return 'top 2 seeds get byes through Round 1 and the quarterfinals';return b?`top ${b===1?'seed gets':b+' seeds get'} a first round bye`:'no byes'}
function regChoices(n){ // regular season lengths allowed: playoffs start right after (Round 15 to 17) and end when the bracket is done (Round 16 to 20)
  const {pr}=poRounds(n);const out=[];
  for(let reg=PO_START[0]-1;reg<=PO_START[1]-1;reg++){const end=reg+pr;if(end>=PO_END[0]&&end<=PO_END[1])out.push(reg)}
  return out;
}
function seasonOpts(n,sea){
  const {pr}=poRounds(n);sea=sea||{};const ch=regChoices(n);
  const reg=ch.includes(+sea.reg)?+sea.reg:(ch.includes(PO_START[0]-1)?PO_START[0]-1:ch[0]);
  return {reg,poStart:reg+1,poEnd:reg+pr};
}
function plan(n){
  if(n<2) return {reg:0,brk:0,pr:0,q:0,single:0,poStart:0,poEnd:0,spans:[]};
  const single=n%2?n:n-1;const {q,pr}=poRounds(n);
  const {reg,poStart,poEnd}=seasonOpts(n,S.cfg.season);
  const L=poEnd-poStart+1,base=Math.floor(L/pr),extra=L%pr;const spans=[];let at=poStart;
  for(let p=1;p<=pr;p++){const len=base+(p>pr-extra?1:0);spans.push([at,at+len-1]);at+=len}
  return {reg,brk:poStart-reg-1,pr,q,single,poStart,poEnd,spans};
}
function roundRobin(ids){
  let a=[...ids];if(a.length%2)a.push(null);const n=a.length,out=[];
  for(let r=0;r<n-1;r++){const pairs=[];for(let i=0;i<n/2;i++){const x=a[i],y=a[n-1-i];pairs.push(r%2?[y,x]:[x,y])}out.push(pairs);a=[a[0],a[n-1],...a.slice(1,n-1)]}
  return out;
}
const fpPlayer=s=>!s?0:(+s.pts||0)+1.5*(+s.ast||0)+1.2*(+s.reb||0)+3*(+s.stl||0)+3*(+s.blk||0)-3*(+s.to||0);
const fpOff=pf=>pf==null||pf===''?0:Math.min(20,0.5*Math.max(0,pf-48));
const fpDef=pa=>pa==null||pa===''?0:Math.max(0,20-0.5*Math.max(0,pa-55));
const r1=x=>Math.round(x*10)/10;
const hasLine=s=>s&&s.min!==''&&s.min!=null;

function computeLinks(){const m={...LINKSRAW};joinedAll().forEach(([u,d])=>{if(!Object.values(m).includes(u))m[d.cid]=u});const used=new Set(Object.values(m));const ids=new Set((RAWCOACHES||[]).map(c=>c.id));

function arrange(base,a){if(!a)return base;const set=[...base.starters,...base.reserves];const inS=new Set(set);const s=(a.starters||[]).filter(x=>inS.has(x)),r=(a.reserves||[]).filter(x=>inS.has(x)&&!s.includes(x));const used=new Set([...s,...r]);
  for(const x of set){if(used.has(x))continue;(base.starters.includes(x)&&s.length<5?s:r).push(x);used.add(x)}while(s.length>5)r.unshift(s.pop());while(s.length<5&&r.length&&base.starters.length>=5)s.push(r.shift());return {...base,starters:s,reserves:r}}

function clockLeft(){const c=S.draft.clock;if(!c||c.state==='off'||noLimit())return null;if(c.state==='paused')return Math.max(0,c.left);return Math.max(0,c.start+pickSec()*1000-Date.now())}

/* Matchups for a fantasy round number */
function regPairs(n){
  const pl=plan(leagueSize());if(n<1||n>pl.reg)return null;
  const base=roundRobin(coachOrder());const idx=(n-1)%pl.single;return base[idx];
}
function roundKind(n){const pl=plan(leagueSize());if(n<=pl.reg)return 'reg';if(n<pl.poStart)return 'break';if(n<=pl.poEnd)return 'po';return 'none'}

function scoreCoach(rd,cid){
  const lu=rd?.lineups?.[cid];if(!lu)return null;
  const st=rd.stats||{},ts=rd.teams||{};
  const used=new Set(),rows=[];let starter=0,max=0;
  for(const pid of lu.starters){
    const s=st[pid];
    if(hasLine(s)&&+s.min===0){
      const sub=lu.reserves.find(r=>!used.has(r)&&hasLine(st[r])&&+st[r].min>0);
      rows.push({pid,role:'S',out:true,fp:0});
      if(sub){used.add(sub);const f=fpPlayer(st[sub]);rows.push({pid:sub,role:'R',in:true,fp:f});starter+=f;max=Math.max(max,f)}
    }else{const f=hasLine(s)?fpPlayer(s):0;rows.push({pid,role:'S',fp:f,pending:!hasLine(s)});starter+=f;max=Math.max(max,f)}
  }
  let res=0;for(const r of lu.reserves){if(used.has(r))continue;const f=hasLine(st[r])?fpPlayer(st[r]):0;res+=f;rows.push({pid:r,role:'R',fp:f,bench:true,pending:!hasLine(st[r])})}
  const o=ts[lu.off]||{},d=ts[lu.def]||{};
  const off=fpOff(o.pf),def=fpDef(d.pa);
  return {rows,starter,res,max,off,def,total:starter+off+def,lu};
}
function decide(a,b){ // returns 1 if a wins, -1 if b, 0 tie
  if(!a||!b)return 0;
  const k=[x=>x.total,x=>x.res,x=>x.starter,x=>x.max];
  for(const f of k){const d=r1(f(a))-r1(f(b));if(d>0)return 1;if(d<0)return -1}
  return 0;
}
function standings(){
  const pl=plan(leagueSize());
  const tab=Object.fromEntries(S.cfg.coaches.map(c=>[c.id,{id:c.id,w:0,l:0,t:0,pf:0,g:0,pa:0}]));
  let played=0;
  for(let n=1;n<=pl.reg;n++){
    const rd=S.rounds['r'+n];if(!rd?.final)continue;played++;
    for(const [a,b] of regPairs(n)||[]){
      if(!a||!b)continue;const sa=scoreCoach(rd,a),sb=scoreCoach(rd,b);if(!sa||!sb)continue;
      const d=decide(sa,sb);const A=tab[a],B=tab[b];if(!A||!B)continue;
      A.pf+=sa.total;B.pf+=sb.total;A.pa+=sb.total;B.pa+=sa.total;A.g++;B.g++;
      if(d>0){A.w++;B.l++}else if(d<0){B.w++;A.l++}else{A.t++;B.t++}
    }
  }
  const rows=Object.values(tab).map(r=>({...r,pct:r.g?(r.w+r.t/2)/r.g:0,avg:r.g?r.pf/r.g:0}));
  rows.sort((x,y)=>y.pct-x.pct||y.avg-x.avg||coachName(x.id).localeCompare(coachName(y.id)));
  return {rows,played,reg:pl.reg};
}
function seedOrder(size){let o=[1];while(o.length<size){const m=o.length*2+1;o=o.flatMap(s=>[s,m-s])}return o}
function scoreSpan(from,to,cid){ // playoff matchup spanning several rounds: totals add up
  let agg=null,final=true;
  for(let n=from;n<=to;n++){const rd=S.rounds['r'+n];if(!rd?.final)final=false;const sc=scoreCoach(rd,cid);if(!sc)continue;
    agg=agg||{total:0,res:0,starter:0,max:0};agg.total+=sc.total;agg.res+=sc.res;agg.starter+=sc.starter;agg.max=Math.max(agg.max,sc.max)}
  return {sc:agg,final};
}
function bracket(){
  const pl=plan(leagueSize());if(!pl.q)return null;
  const st=standings();const seeds=st.rows.slice(0,pl.q).map(r=>r.id);
  const size=2**pl.pr;const order=seedOrder(size);
  let slots=(pl.q===10?SLOTS10:order).map(s=>s&&s<=pl.q?{seed:s,id:seeds[s-1]}:null);
  const cols=[];
  for(let p=1;p<=pl.pr;p++){
    const [from,to]=pl.spans[p-1];const games=[],next=[];
    for(let i=0;i<slots.length;i+=2){
      const a=slots[i],b=slots[i+1];let w=null,sa=null,sb=null;
      if(a&&!b)w=a;else if(b&&!a)w=b;
      else if(a&&b&&a.id&&b.id){const A=scoreSpan(from,to,a.id),B=scoreSpan(from,to,b.id);sa=A.sc;sb=B.sc;if(A.final&&sa&&sb){const d=decide(sa,sb);w=d>=0?a:b}}
      games.push({a,b,w,sa,sb,bye:!a||!b});next.push(w?{...w}:(!a&&!b?null:{seed:null,id:null}));
    }
    cols.push({p,n:from,from,to,games});slots=next;
  }
  return {cols,final:st.played>=pl.reg&&pl.reg>0,champ:slots[0]?.id||null};
}
function poPairs(n){const b=bracket();if(!b)return null;const c=b.cols.find(c=>n>=c.from&&n<=c.to);if(!c)return null;return c.games.filter(g=>!g.bye).map(g=>[g.a?.id||null,g.b?.id||null])}

function formatSummary(pl,n){

  return `Regular season: ${rangeTxt(1,pl.reg)}, ${meet}${n%2?', one bye each round':''}. ${pl.brk?`Break: ${rangeTxt(pl.reg+1,pl.poStart-1)}. `:''}Playoffs: ${rangeTxt(pl.poStart,pl.poEnd)}, ${pl.q} teams. ${pl.spans.map((sp,i)=>`${poName(i+1,pl.pr)} ${rangeTxt(sp[0],sp[1])}`).join(', ')}.`;

  <h2 class="vt">League Rules</h2>
  <p class="vsub">Adapted from the B1G Basketball Fantasy League rulebook for the 2026–27 season.</p>
  <div class="rules">
   <section><h3>General</h3><ol>
    <li>The league holds an even number of teams: 4, 6, 8, 10 or 12, so every team plays every round with no regular season byes. The commissioner sets the league size first, then builds the season and playoff format around it.</li>
    <li>Round robin format. The commissioner sets how many regular season rounds there are (${PO_START[0]-1}, ${PO_START[0]} or ${PO_START[1]-1}), and the round robin repeats until they run out.${leagueSize()?` This season: ${pl.reg} rounds with ${leagueSize()} teams.`:''} Afterward the top seeds play a single-elimination tournament for the title.</li>
    <li>Round 1 starts <strong>${fmtDW(ROUNDS[0].start)}</strong>. Each round pairs two coaches, and the higher fantasy total for the round wins.</li>
    <li>A round is each Big Ten team's next conference game. Round 1 is every team's first league game, Round 2 every team's second, and so on through Round 20. Because teams play on different days, rounds overlap: Round 1 runs ${fmtD(ROUNDS[0].start)} – ${fmtD(ROUNDS[0].end)} while Round 2 runs ${fmtD(ROUNDS[1].start)} – ${fmtD(ROUNDS[1].end)}.</li>
    <li>On the <a href="#rounds">Round Schedule</a>, a team's players and units score only in the game where that team's name is bold. A team can appear twice in a round's date window, but only its bold game counts.</li>
    <li>Standings go by win-loss record. Ties in record are broken by average points scored.</li>
   </ol></section>
   <section><h3>Draft & rosters</h3><ol>
    <li>Every roster holds five starters (any position), two reserves, one team offense and one team defense. Offense and defense can come from different schools, such as Purdue offense with Indiana defense.</li>
    <li>The draft is nine rounds, run one of two ways as chosen by the commissioner. <strong>Snake</strong> (the main format): the order reverses every round, so the last pick of Round 1 also gets the first pick of Round 2. <strong>Straight, NFL-style</strong>: the same order every round. This season: ${draftTypeName()}. Each coach takes seven players, one offense and one defense in any order.</li>
    <li>Each pick is on a clock: 45, 60, 90 or 120 seconds, set by the commissioner (90 by default), or no time limit; this season: ${secTxt()}. The clock restarts after every pick. If time runs out, the pick is made automatically: the highest ranked player still available (by Rank in the Player Pool). Once a coach's remaining picks are needed for his team offense and defense, the auto pick takes the highest projected unit he still needs instead.</li>
    <li>If a pick was entered wrong, the commissioner can fix it on the Draft Board, during or after the draft, by swapping in an undrafted player for a player, or a team for a team of the same kind. The pick keeps its spot and the fix is logged on Roster Changes.</li>
    <li>Add and drop free agents any time during the regular season. Moves take effect the next round that has not started.</li>
    <li>Send roster moves to the commissioner, who approves them, logs them on <a href="#roster-changes">Roster Changes</a> and updates the <a href="#rosters">Roster Summary</a>.</li>
    <li>If two coaches ask for the same free agent, the first request wins.</li>
    <li>Lineups (starter and reserve swaps, reserve order) can be changed until the first game of the round tips off. The Round Schedule shows each game's tip time and marks the earliest game of every round. Changes made after that count from the next round. No new lineup means last round's lineup carries over.</li>
   </ol></section>
   <section><h3>Injuries & reserves</h3><ol>
    <li>If a starter logs 0 minutes in his game for the round, the first reserve who played takes his place automatically, then the second.</li>
    <li>A starter who plays even 1 minute counts, even if he gets hurt in that game.</li>
    <li>The same applies to suspensions and any other absence.</li>
    <li>An injured starter left in the lineup goes back to scoring as soon as he appears in a box score. Ask the commissioner to move him to reserve if you don't want that.</li>
    <li>Big Ten injury reports: <a href="https://www.rotowire.com/cbasketball/injury-report.php?conf=3" target="_blank" rel="noopener">RotoWire</a>.</li>
   </ol></section>
   <section><h3>Scoring</h3>
    <p class="small muted" style="margin-top:0">Only the five starters (or reserves subbed in) and the two team units score.</p>
    <div class="scorekey"><span class="num">+1</span><span>per point</span><span class="num">+1.5</span><span>per assist</span><span class="num">+1.2</span><span>per rebound</span><span class="num">+3</span><span>per steal</span><span class="num">+3</span><span>per block</span><span class="num">−3</span><span>per turnover</span></div>
    <h4 style="margin-top:14px">Team defense</h4><p class="small" style="margin:0 0 8px">Starts at 20. Loses 0.5 for every point the opponent scores above 55, bottoming out at 0 when they reach 95. Example: holding a team to 63 is 16 points.</p>
    <h4>Team offense</h4><p class="small" style="margin:0">Earns 0.5 for every point scored above 48, capped at 20 (88 points). Example: scoring 77 is 14.5 points.</p>
    <h4 style="margin-top:14px">Tiebreakers in a round</h4><ol class="small"><li>Points scored by reserves</li><li>Total starter points</li><li>Most points by a single player</li></ol>
   </section>
   <section><h3>Playoffs</h3><ol>
    <li>The commissioner sets how many teams make the playoffs, always an even number (2, 4, 6, 8, 10 or 12, up to the league size). With 10 teams, seeds 1 and 2 skip Round 1 and the quarterfinals while seeds 3 to 10 play down to two semifinal spots. Otherwise, when that number doesn't fill a full bracket (2, 4, 8 or 16), the top seeds get first round byes.${playoffTeams()?(()=>{const b=bracketFor(playoffTeams());return ` This season: ${b.q} of ${leagueSize()} teams make it, ${byeTxt(b.byes,b.dbl)}.`})():''}</li>
    <li>The playoffs start the round right after the regular season ends, with no break, anywhere from Round 15 to Round 17. Each playoff matchup is one round, so the playoff format decides when the season ends (between Round 16 and Round 20): a 2 round bracket ends two rounds after it starts, a 3 round bracket three, and so on.${leagueSize()&&playoffTeams()?` This season: regular season Rounds 1 to ${pl.reg}, playoffs ${rangeTxt(pl.poStart,pl.poEnd)}.`:''}</li>
    <li>Playoff rounds overlap like regular rounds, so the next round's lineup is due before you know whether you advanced.</li>
    <li>Ties use the regular-season tiebreakers.</li>
   </ol></section>
   <section><h3>Stats</h3><ol>
    <li>Draft rankings and player research: <a href="https://barttorvik.com/" target="_blank" rel="noopener">Bart Torvik</a>. The pool here starts from CBS Sports' projected lineups and gets updated as the season moves.</li>
    <li>Head-to-head and playoff stats come from official <a href="https://bigten.org/sports/mbball" target="_blank" rel="noopener">Big Ten</a> box scores.</li>
   </ol></section>
  </div>`;
}

function projNote(){return `<details class="panel" style="margin-bottom:12px"><summary class="small" style="cursor:pointer"><strong>How projections work</strong> (updated with games through ${CUR_ASOF} · model refit Nov 17, 2026 · preseason Nov 4, 2026)</summary><div class="small" style="margin-top:8px;max-width:75ch">
  <p style="margin:0 0 6px"><strong>In season updates (refit Nov 17):</strong> Proj FP/game is the expected score in an average Big Ten conference game, built from two parts that update every morning. <em>Minutes</em>: the preseason minutes estimate counts like one game, so after a few games it is almost entirely his actual minutes this season. <em>Production per minute</em>: the preseason rate counts like 150 minutes of play (about five full games), blended with his schedule adjusted fantasy points per minute this season. Proj FP/game = rate × minutes. In a backtest on 113 Big Ten players from 2025-26, this predicted conference play about 15% better than the old blend after four games (average miss 4.1 vs 4.8 FP/game). Players who have not played keep their preseason number. Offense and defense units still use (5 × preseason + games × current) ÷ (5 + games).</p>
  <p style="margin:0 0 6px"><strong>Two season model (Nov 13):</strong> preseason numbers were refined with every box score from 2023-24 through 2025-26. Each player's per minute production is adjusted for opponent and home or away, then projected with a formula fit on 965 returning players: next season rate = 0.219 + 0.485 × last season + 0.253 × the season before (one season version when only one exists). This pulls extreme seasons back toward normal and cut preseason error about 13% versus simply repeating last season. Big Ten conference games run about 3% below a full season average, so projections are now on a per Big Ten game basis.</p>
  <p style="margin:0 0 6px"><strong>Single games:</strong> Next game and roster projections adjust for the opponent's defense (fantasy points it allowed relative to each player's norm last season, regressed toward average) and home (+7.7%) or away (−7.2%). Single games are noisy: a 25 point player typically lands between 13 and 40. The range shown covers about 8 games in 10, widened or narrowed by each player's own history of steady or streaky games. In a backtest on 3,643 Big Ten games from 2025-26, the matchup adjustment cut average error from 7.1 to 7.0 points per game and the range caught 80% of results.</p>
  <p style="margin:0 0 6px"><strong>Players:</strong> last season's per game stats from <a href="https://www.sports-reference.com/cbb/" target="_blank" rel="noopener">Sports Reference</a>, run through this league's scoring, then adjusted for the role each player is projected to have this season (more minutes for new starters, fewer for bench players). Transfers from smaller conferences are discounted (about 12% from mid majors, 20% from low majors). Players with pending eligibility are discounted 30%. Freshmen and players without Division I stats get an estimate (five star freshmen 16, other starters 13, bench 5 to 6).</p>
  <p style="margin:0 0 6px"><strong>Teams:</strong> <a href="https://barttorvik.com/trank.php" target="_blank" rel="noopener">Bart Torvik</a> 2027 T-Rank offense, defense and tempo, played against an average Big Ten opponent. Penn State was not in the Torvik table, so its numbers are estimated.</p>
  <p style="margin:0">Projections are a guide, not a promise. Injuries, eligibility rulings and roles change during the season.</p></div></details>`}

const fmtDraft=ts=>new Date(ts).toLocaleString('en-US',{timeZone:'America/New_York',weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' ET';
const toLocalInput=ts=>{const d=new Date(ts);const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`};
function draftWhen(){const t=S.cfg.draftAt;if(!t||(S.draft.picks||[]).length)return null;return t}
function draftSchedHTML(started){const t=S.cfg.draftAt;if(started)return t?`<p class="tiny muted" style="margin:10px 0 0">Scheduled for ${fmtDraft(t)}.</p>`:'';
  const r1=lockTs(ROUNDS[0]);const late=t&&t>=r1;
  return `<div style="margin:0 0 12px;padding:10px 12px;border:1px solid var(--line);border-radius:6px"><div class="small" style="margin-bottom:6px"><strong>Draft date and time</strong>${t?` · <span style="color:${late?'var(--loss)':'var(--accent)'}">${fmtDraft(t)}</span>`:' · <span class="muted">not set</span>'}</div>
   <div class="row" style="gap:8px;flex-wrap:wrap"><input type="date" id="draftDateIn" value="${t?toLocalInput(t).slice(0,10):''}" style="flex:1 1 150px"><select id="draftTimeIn" style="flex:0 1 130px" aria-label="Draft time">${(()=>{const cur=t?toLocalInput(t).slice(11,16):'19:00';let o='';for(let m=0;m<1440;m+=15){const hh=String(Math.floor(m/60)).padStart(2,'0'),mm=String(m%60).padStart(2,'0');const v=hh+':'+mm;const h12=(Math.floor(m/60)%12)||12;o+=`<option value="${v}"${v===cur?' selected':''}>${h12}:${mm} ${m<720?'AM':'PM'}</option>`}return o})()}</select><button data-act="saveDraftAt">${t?'Update':'Set date'}</button>${t?'<button class="ghost danger" data-act="clearDraftAt">Clear</button>':''}</div>
   <p class="tiny muted" style="margin:6px 0 0">Times are in 15 minute steps, entered in your own time zone; everyone sees it in Eastern time on Home and the Draft Board. ${late?'<strong style="color:var(--loss)">This is after Round 1 lineups lock ('+fmtLock(ROUNDS[0])+'). Draft before then.</strong>':'Must be before Round 1 lineups lock: '+fmtLock(ROUNDS[0])+'.'}</p></div>`}
function draftStep(started){
  const total=leagueSize()*9;const made=(S.draft.picks||[]).length;
  let body;
  if(!ready())body=`<p class="small muted" style="margin:0">Unlocks when Steps 1 to 4 are done${leagueSize()&&S.cfg.coaches.length<leagueSize()?` (${leagueSize()-S.cfg.coaches.length} more coach${leagueSize()-S.cfg.coaches.length>1?'es':''} needed)`:''}${leagueSize()&&!playoffTeams()?' (playoff teams not set)':''}.</p>`;
  else if(made>=total)body=`<p class="small" style="margin:0 0 10px">The draft is complete: ${total} picks made. Lineups and roster moves are on the Roster Summary.</p><div class="row"><a class="btn" href="#rosters">Open Roster Summary</a><a class="btn" href="#matchups">See the schedule</a></div>`;
  else body=`<p class="small" style="margin:0 0 10px">${made?`${made} of ${total} picks made. Pick #${made+1} is on the clock.`:`Ready to draft: ${leagueSize()} coaches, 9 rounds, ${total} picks, ${draftTypeName()} order.`} Each coach gets ${secTxt()}. Start the draft on the Draft Board to begin the clock, then search the player or team and click it to draft it for the coach on the clock.</p><div class="row"><a class="btn pri" href="#draft-board" style="text-decoration:none">${made?'Resume the draft':'Start the draft'}</a><a class="btn" href="#matchups" style="text-decoration:none">See the head to head schedule</a></div>`;
  return `<div class="panel"><h3>Step 6 · Run the draft</h3>${made>=total?'':draftSchedHTML(made>0)}${body}</div>`;
}
function sizePanel(started){

function playoffPanel(started){

   ${b?`<p class="small" style="margin:10px 0 0">${b.q} teams, ${b.pr} playoff round${b.pr>1?'s':''}, ${byeTxt(b.byes,b.dbl)}${b.dbl?' (seeds 3 to 10 play Round 1, the 4 winners play the quarterfinals, and 2 survivors meet seeds 1 and 2 in the semifinals)':b.byes?` (seed${b.byes>1?'s':''} 1${b.byes>1?` to ${b.byes}`:''} skip straight to the ${poName(2,b.pr).toLowerCase()})`:''}.${e-b.q?` ${e-b.q} team${e-b.q>1?'s miss':' misses'} the playoffs.`:''}</p>`:''}

function seasonPanel(){
  if(!leagueSize()||!playoffTeams())return `<div class="panel"><h3>Step 3 · Season format</h3><p class="small muted" style="margin:0">${leagueSize()?'Choose how many teams make the playoffs in Step 2.':'Choose the league size in Step 1.'} The regular season and playoff round options depend on the size of the bracket.</p></div>`;

    <label class="f">Regular season rounds<select id="sReg">${regChoices(n).map(x=>`<option value="${x}"${x===so.reg?' selected':''}>${x}</option>`).join('')}</select></label>
    <label class="f">Playoffs start<input id="sPSv" value="Round ${so.poStart}" readonly style="width:110px"></label>

   <p class="tiny muted" style="margin:6px 0 0">Playoffs start the round right after the regular season ends (Round ${PO_START[0]} to ${PO_START[1]}). A ${q} team bracket${byes?` with ${byes} bye${byes>1?'s':''}`:''} takes ${pr} round${pr>1?'s':''}, one round per matchup, so the season ends ${pr} round${pr>1?'s':''} after the regular season. ${regChoices(n).length<3?`Only ${regChoices(n).join(' or ')} regular season rounds keep the finish between Round ${PO_END[0]} and ${PO_END[1]}.`:''}</p></div>`;

async function ensureLocks(){ // lock any round whose first tip has passed before a roster change lands
  if(!db||!S.admin)return;const now=Date.now();
  for(const R of ROUNDS){if(lockTs(R)>now)continue;if(R.end.getTime()+864e5<now)continue;const rd=S.rounds['r'+R.n];if(rd?.lineups)continue;
    if(!S.cfg.coaches.every(c=>rosterOf(c.id).starters.length))continue;
    const lineups={};for(const c of S.cfg.coaches){const ro=rosterAt(c.id,lockTs(R));lineups[c.id]={starters:[...ro.starters],reserves:[...ro.reserves],off:ro.off,def:ro.def}}
    const doc={n:R.n,lineups,stats:rd?.stats||{},teams:rd?.teams||{},final:false,lockedAt:now};S.rounds={...S.rounds,['r'+R.n]:doc};S.work[R.n]=structuredClone(doc);

}

async function makePick(k){
  if(S.picking)return;
  const ids=coachOrder();const n=ids.length;const picks=[...(S.draft.picks||[])];const i=picks.length;
  if(i>=n*9){toast('The draft is complete.');return}
  const cid=pickCoach(i,ids);
  if(picks.some(p=>p.k===k)||ownerMap()[k]){toast(`${itemText(k)} is already drafted.`);return}
  const [t]=k.split(':');const nd=needs(cid);
  if(t==='P'&&nd.P<=0){toast(`${coachName(cid)} has 7 players. Pick a team offense or defense.`);return}
  if(t==='O'&&!nd.O){toast(`${coachName(cid)} already has an offense.`);return}
  if(t==='D'&&!nd.D){toast(`${coachName(cid)} already has a defense.`);return}
  picks.push({k,c:cid});S.pickFilter='';
  const r=draftRoster(cid,picks);

  S.picking=true;S.draft={picks,clock};S.rosters={...S.rosters,[cid]:r};render();
  try{await write(async()=>{await db.doc('league/draft').set({picks,clock});await setRoster(cid,r)},`${coachName(cid)} takes ${itemText(k)}`)}
  finally{S.picking=false;render()}
}
function bestAvailable(){
  const ids=coachOrder();const n=(S.draft.picks||[]).length;const cid=pickCoach(n,ids);const need=needs(cid);const own=ownerMap();
  const left=9-(S.draft.picks||[]).filter(p=>p.c===cid).length;const teamsNeeded=need.O+need.D;
  if(need.P>0&&left>teamsNeeded){const best=allPlayers().filter(p=>!own['P:'+p.id]&&pj(p.id)).sort((a,b)=>pj(a.id).rk-pj(b.id).rk)[0];if(best)return 'P:'+best.id}
  const opts=[];
  if(need.O>0)TEAMS.filter(t=>!own['O:'+t.k]).forEach(t=>opts.push({k:'O:'+t.k,v:TPROJ[t.k].ofp}));
  if(need.D>0)TEAMS.filter(t=>!own['D:'+t.k]).forEach(t=>opts.push({k:'D:'+t.k,v:TPROJ[t.k].dfp}));
  opts.sort((a,b)=>b.v-a.v);return opts[0]?.k||null;
}

  },500);
let TITLE0=null,wakeL=null;
function draftAlerts(){const picks=S.draft.picks||[];const st=S.draft.clock?.state||'off';const live=st!=='off'&&picks.length<draftTotal()&&picks.length<(coachOrder().length*9);
  const mine=myCid();const up=live&&mine&&!S.admin&&pickCoach(picks.length,coachOrder())===mine;
  if(TITLE0==null)TITLE0=document.title;
  if(up){document.title=(Math.floor(Date.now()/1000)%2)?'⏰ Your pick!':TITLE0;if(S.wasUp!==picks.length){S.wasUp=picks.length;try{navigator.vibrate&&navigator.vibrate([250,120,250])}catch(e){}toast('You are on the clock!')}}
  else if(document.title!==TITLE0)document.title=TITLE0;
  const want=live&&(mine||S.admin)&&document.visibilityState==='visible';
  if(want&&!wakeL&&navigator.wakeLock){wakeL='pending';navigator.wakeLock.request('screen').then(l=>{wakeL=l;l.addEventListener('release',()=>{wakeL=null})}).catch(()=>{wakeL=null})}
  else if(!want&&wakeL&&wakeL!=='pending'){try{wakeL.release()}catch(e){}wakeL=null}}
setInterval(()=>{const el=document.getElementById('pickClock');if(!el)return;const left=clockLeft();if(left==null)return;el.textContent=left===0?"Time's up":fmtClock(left);el.style.color=left===0?'var(--loss)':left<=10000?'var(--warn)':''},250);
/* ===================== Data wiring ===================== */
(async function boot(){
  render();
  const c=window.claude;
  if(!c||!c.use){S.dbOK=false;render();return}
  const [d,u]=await Promise.all([c.use('db'),c.use('user')]);
  db=d;S.dbOK=!!d;
  if(u){try{S.admin=await u.canEdit()}catch(e){S.admin=false}S.realAdmin=S.admin;try{S.me=await u.id()}catch(e){S.me=null}USER=u}
  document.getElementById('who').innerHTML=S.admin?'<a href="#commissioner" style="color:inherit">Commissioner view</a>':'';
  if(!db){render();return}
  const timer=setTimeout(()=>{const n=document.getElementById('loadNote');if(n)n.textContent='League data is taking a while to load. It may be out of date.'},10000);
  let pending=new Set(['cfg','draft','rosters','rounds','changes','players']);
  const done=(k,snap)=>{if(snap&&!snap.metadata.fromCache)pending.delete(k);if(!pending.size){S.loaded=true;clearTimeout(timer)}};
  const err=k=>e=>{pending.delete(k);if(!pending.size){S.loaded=true;clearTimeout(timer)}render()};
  db.doc('league/config').onSnapshot(s=>{if(s.exists){const v=s.data();S.cfg={name:v.name||S.cfg.name,coaches:applyNames(v.coaches||[],v.expected),order:v.order||[],season:v.season||null,draftType:v.draftType||'snake',expected:v.expected||0,playoffTeams:v.playoffTeams||0,pickSec:v.pickSec??90,draftAt:v.draftAt||null};S.sd=null}done('cfg',s);render()},err('cfg'));
  db.doc('league/draft').onSnapshot(s=>{S.draft=s.exists?{picks:[...(s.data().picks||[])],clock:s.data().clock?{...s.data().clock}:null}:{picks:[],clock:null};done('draft',s);render()},err('draft'));
  db.collection('rosters').onSnapshot(q=>{const m={};q.docs.forEach(x=>{const v=x.data();m[x.id]={starters:[...(v.starters||[])],reserves:[...(v.reserves||[])],off:v.off||'',def:v.def||'',ts:v.ts||0}});S.rosters=m;done('rosters',q);render()},err('rosters'));
  db.collection('rounds').onSnapshot(q=>{const m={};q.docs.forEach(x=>m[x.id]=structuredClone(x.data()));S.rounds=m;
    for(const k in m){const n=+k.slice(1);if(!S.dirty||n!==S.resRound)S.work[n]=structuredClone(m[k])}
    done('rounds',q);if(!(S.dirty&&location.hash==='#round-results'))render()},err('rounds'));
  db.collection('changes').orderBy('ts','desc').limit(300).onSnapshot(q=>{S.changes=q.docs.map(x=>({...x.data(),_id:x.id}));done('changes',q);render()},err('changes'));
  db.doc('league/curstats').onSnapshot(s=>{if(s.exists){const v=s.data();if(v.players&&Object.keys(v.players).length){CUR={...v.players};CUR_ASOF=v.asOf||CUR_ASOF}if(v.teams&&Object.keys(v.teams).length){CURT={...v.teams};blendTeams()}render()}},()=>{});
  db.doc('league/injuries').onSnapshot(s=>{const v=s.exists?s.data():{};S.inj=structuredClone(v.players||{});S.injAsOf=v.asOf||null;render()},()=>{});
  db.doc('league/links').onSnapshot(s=>{LINKSRAW=s.exists?{...(s.data().map||{})}:{};computeLinks();refreshNames();loadNames();render()},()=>{});
  db.collection('coachlu').onSnapshot(q=>{const m={};q.docs.forEach(x=>m[x.id]=structuredClone(x.data()));S.coachlu=m;computeLinks();refreshNames();loadNames();render()},()=>{});
  db.doc('league/tips').onSnapshot(s=>{S.tips=s.exists?{...(s.data().times||{})}:{};render()},()=>{});
  db.collection('players').onSnapshot(q=>{S.extra=q.docs.map(x=>({...x.data()}));done('players',q);render()},err('players'));
})();
</script>
